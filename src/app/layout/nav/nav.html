<header class="nav">
  <div class="container nav__inner">
    <a routerLink="/" class="nav__brand" (click)="close()">
      <span class="nav__mark">MK</span>
      <span class="nav__name">Mandar Kharat</span>
    </a>

    <nav class="nav__links" [class.open]="open()">
      @for (link of links; track link.href) {
        <a [href]="link.href" (click)="close()">{{ link.label }}</a>
      }
      <a class="nav__cta" href="/#contact" (click)="close()">Get in touch</a>
    </nav>

    <div class="nav__controls">
      <button
        class="nav__theme"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        title="Toggle theme"
      >
        @if (theme.theme() === 'dark') {
          <!-- sun -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
        } @else {
          <!-- moon -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>

      <button class="nav__burger" (click)="toggle()" [attr.aria-expanded]="open()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
